name: Full-stack checks

on:
  push:
    branches:
      - main
      - scrum-12
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Test backend and frontend
        run: npm test
      - name: Build React production bundle
        run: npm run build
      - name: Install browser for SCRUM-12 integration tests
        run: npx playwright install --with-deps chromium
      - name: Test SCRUM-12 in the browser
        run: npm run test:e2e
